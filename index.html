<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Account Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ei-cyan:#00a1de;
    --ei-blue:#1a6fc0;
    --ei-heading:#2b78c2;
    --ei-dark:#102a43;
    --ei-navy:#0b5fab;
    --ei-footer:#1a6fc0;
    --ei-border:#c9ccd1;
    --ei-placeholder:#9aa0a6;
    --sans:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    --serif:"Lora",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--sans);
    color:var(--ei-dark);
    background:#fff;
    min-height:100%;
    display:flex;
    flex-direction:column;
  }
  .page{flex:1 0 auto;display:grid;grid-template-columns:1fr 1fr;}
  .left{position:relative;padding:46px 56px 56px;display:flex;flex-direction:column;}
  .left::after{content:"";position:absolute;top:0;right:-40px;bottom:0;width:260px;background:radial-gradient(120% 90% at 100% 20%,rgba(0,161,222,.05),rgba(0,161,222,0) 60%);pointer-events:none;}
  .logo{margin-bottom:96px;}
  .logo img{width:132px;height:auto;display:block;}
  .form-wrap{max-width:600px;}
  h1{font-family:var(--serif);font-weight:500;color:var(--ei-heading);font-size:42px;margin:0 0 14px;}
  .sub{font-size:16px;color:var(--ei-dark);margin:0 0 34px;}
  label{display:block;font-weight:700;font-size:14px;margin:0 0 8px;color:var(--ei-dark);}
  .field{margin-bottom:22px;}
  .input{position:relative;}
  .input input{width:100%;height:52px;border:1px solid var(--ei-border);border-radius:4px;padding:0 16px;font-size:15px;font-family:var(--sans);color:var(--ei-dark);background:#fff;outline:none;}
  .input input::placeholder{color:var(--ei-placeholder);}
  .input input:focus{border-color:var(--ei-cyan);}
  .show{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-weight:700;font-size:13px;letter-spacing:.3px;color:var(--ei-dark);background:none;border:0;cursor:pointer;font-family:var(--sans);}
  .forgot{text-align:right;margin:-6px 0 30px;}
  .forgot a{color:var(--ei-blue);text-decoration:underline;font-size:15px;}
  .actions{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .login-btn{display:inline-flex;align-items:center;gap:30px;background:var(--ei-navy);color:#fff;border:0;border-radius:999px;padding:0 10px 0 28px;height:52px;font-size:16px;font-weight:600;font-family:var(--sans);cursor:pointer;}
  .login-btn .arrow{width:34px;height:34px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;}
  .login-btn .arrow svg{width:16px;height:16px;}
  .signup{font-size:16px;color:var(--ei-dark);}
  .signup a{color:var(--ei-blue);text-decoration:underline;font-weight:600;}
